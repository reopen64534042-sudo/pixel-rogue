const sat = (n) => Math.max(0, Math.min(1, n));
const phase = (n) => n - Math.floor(n);
const noise = (n) => phase(Math.sin(n * 127.1 + 31.7) * 4375.13);
function ring(c, x, y, r, color, alpha, segments = 28, rotation = 0) {
    c.globalAlpha = sat(alpha);
    c.strokeStyle = color;
    c.beginPath();
    for (let i = 0; i <= segments; i++) {
        const a = rotation + i / segments * TAU;
        const px = Math.round(x + Math.cos(a) * Math.max(1, r)), py = Math.round(y + Math.sin(a) * Math.max(1, r));
        if (i)
            c.lineTo(px, py);
        else
            c.moveTo(px, py);
    }
    c.stroke();
    c.globalAlpha = 1;
}
function fleck(c, x, y, color, alpha, size = 2) {
    c.fillStyle = color;
    c.globalAlpha = sat(alpha);
    c.fillRect(Math.round(x), Math.round(y), size, size);
    c.globalAlpha = 1;
}
function shard(c, x, y, length, width, angle, color, light, alpha) {
    const dx = Math.cos(angle), dy = Math.sin(angle);
    c.polygon([x - dy * width, y + dx * width, x + dx * length, y + dy * length, x + dy * width, y - dx * width, x - dx * 2, y - dy * 2], color, alpha);
    c.beam(x, y, x + dx * length * 0.85, y + dy * length * 0.85, 1, light, alpha * 0.85);
}
function arcBolt(c, x, y, x2, y2, seed, width, C, alpha) {
    const dx = x2 - x, dy = y2 - y, d = Math.hypot(dx, dy) || 1;
    let px = x, py = y;
    for (let i = 1; i <= 8; i++) {
        const k = i / 8, bend = i === 8 ? 0 : (noise(i + seed * 17) - 0.5) * width;
        const nx = Math.round(x + dx * k - dy / d * bend), ny = Math.round(y + dy * k + dx / d * bend);
        c.beam(px, py, nx, ny, 3, C.psiViolet, alpha * 0.35);
        c.beam(px, py, nx, ny, 1, C.iceCyan, alpha);
        if (i % 3 === 0)

        px = nx;
        py = ny;
    }
}

export function monsterWarningLane(c, g, progress, C, rounded = true) {

    const x2 = g.x + dx * length, y2 = g.y + dy * length, nx = -dy * width / 2, ny = dx * width / 2;
    c.polygon([g.x + nx, g.y + ny, x2 + nx, y2 + ny, x2 - nx, y2 - ny, g.x - nx, g.y - ny], C.danger, 0.045);

        const x = g.x + dx * d, y = g.y + dy * d;
        c.beam(x - dx * 5 - dy * 3, y - dy * 5 + dx * 3, x, y, 1, C.fireOrange, 0.25 + sat(progress) * 0.45);

export function drawMonsterEffect(c, kind, progress, g, C) {

    if (kind === "projectile") {

        for (let i = 3; i >= 1; i--)
            c.beam(x - dx * i * 3, y - dy * i * 3, x - dx * (i - 1) * 3, y - dy * (i - 1) * 3, Math.max(1, r * 2 - i), color, 0.12 + (3 - i) * 0.08);

    }
    else if (kind === "impact" || kind === "muzzle") {
        const color = kind === "muzzle" ? C.psiPurple : C.sand;
        for (let i = 0; i < 7; i++) {
            const a = angle + (i - 3) * 0.32, d = 2 + k * r;
            shard(c, x + Math.cos(a) * d, y + Math.sin(a) * d, (1 - k) * 5 + 1, 1, a, color, C.bone, fade);

    else if (kind === "fire" || kind === "fire-ground" || kind === "breath" || kind === "lob-flight") {
        if (kind === "lob-flight") {
            const tx = g.endX ?? x, ty = g.endY ?? y;
            const px = x + (tx - x) * k, py = y + (ty - y) * k - Math.sin(k * Math.PI) * Math.min(45, Math.hypot(tx - x, ty - y) * 0.25);

                const a = breath ? angle + (noise(i + seed) - 0.5) * (g.arc ?? 1) * 0.92 : i / count * TAU + noise(i) * 0.2;
                const d = ground ? Math.sqrt(noise(i + seed)) * r * 0.8 : breath ? 10 + p * (r - 15) : r * (0.1 + k * 0.83);
                const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
                const height = ground ? 3 + (1 - p) * 8 : breath ? 4 + p * 9 : 2 + (1 - k) * 12;
                const opacity = ground || breath ? (1 - p) * 0.7 * fade : fade * 0.8;
                c.polygon([px - 3, py + 2, px - 2, py - height / 2, px + 1, py - height, px + 4, py], C.fireDeep, opacity * 0.8);
                shard(c, px, py, height, 2, -Math.PI / 2, C.fireOrange, C.fireYellow, opacity);
            }
            if (!breath)
                ring(c, x, y, ground ? r : r * (0.1 + k * 0.9), C.fireDeep, ground ? 0.45 : fade * 0.6);

    }
    else if (kind === "frost" || kind === "frost-ground" || kind === "spikes") {
        const ground = kind === "frost-ground", spikes = kind === "spikes", inner = g.innerRadius ?? 0;
        const radius = ground ? r : inner + (r - inner) * Math.min(1, k * 2.8);
        ring(c, x, y, radius, C.iceDeep, ground ? 0.4 : fade * 0.7);

            for (let i = 0; i < 20; i++) {
                const a = i / 20 * TAU, d = ground ? Math.sqrt(noise(i + seed)) * r * 0.9 : radius;

            const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d - Math.sin(k * Math.PI) * 9;
            fleck(c, px, py, C.slimeDark, fade, 3);
            fleck(c, px, py, C.slimeLite, fade, 2);

        ring(c, x, y, radius, C.gold, aura ? 0.12 : fade * 0.65, 32);

            ring(c, x, y, Math.max(1, radius - 4), C.pGold, fade * 0.35);
        for (let i = 0; i < 12; i++) {
            const a = i / 12 * TAU;
            fleck(c, x + Math.cos(a) * radius, y + Math.sin(a) * radius, C.gold, aura ? 0.2 : fade, 1);
        }
    }
    else if (kind === "rift" || kind === "summon") {
        const summoning = kind === "summon", radius = r * (summoning ? 0.6 + k * 0.4 : 1 - k * 0.65);

export function renderMonsterPreview(p, card, time, C, fx, warningCircle, warningLane, box = { x: 0, y: 0, w: 208, h: 144 }, showWarnings = true) {
  const [key, , effect] = card;
  const u = ((time % 2.8) + 2.8) % 2.8 / 2.8, preparing = u < 0.3, active = u >= 0.3 && u < 0.78;
  const prep = u / 0.3, k = Math.max(0, Math.min(1, (u - 0.3) / 0.48));

  const radius = key === "brute_elite" && effect === "stone" ? 27 : effect === "aura" ? 55 : 37;
  const geometry = { x, y, radius, seed, time, angle: 0, width: effect === "beam" ? 12 : 10, length: 125, arc: 1.1 };
  p.polygon([x - 17, y + 9, x, y + 4, x + 17, y + 9, x, y + 13], C.ink0, 0.35);
  if (effect === "aura") fx(p, "aura", 0, geometry, C);

    if (lane) warningLane(p, geometry, prep, C);

  }
  if (effect === "crystal") fx(p, "guard", active ? k : 0, { x, y, radius: 21, angle: 0, arc: 2.1 }, C);
  if (effect === "lob" && preparing) fx(p, "lob-flight", prep, { ...geometry, endX: targetX, endY: targetY }, C);
  if (effect === "emerge" && preparing) fx(p, "burrow", 0, { ...geometry, radius: 12 }, C);
  if (effect === "blink" && preparing) fx(p, "rift", prep * 0.5, { ...geometry, x: x + 50, radius: 18 }, C);
  if (active) {
    if (effect === "shot") {
      fx(p, "muzzle", k, { ...geometry, radius: 12 }, C);
      fx(p, "projectile", 0, { ...geometry, x: x + 10 + k * 125, radius: 2 }, C);
    } else if (effect === "lob") {
      if (k < 0.55) fx(p, "fire", k / 0.55, { ...geometry, x: targetX }, C);
      fx(p, "fire-ground", k > 0.9 ? (k - 0.9) * 10 : 0, { ...geometry, x: targetX, radius: 18 }, C);
    } else if (effect === "blink") {
      fx(p, "rift", k, { ...geometry, radius: 18 }, C);
      fx(p, "rift", k * 0.7, { ...geometry, x: x + 50, radius: 18 }, C);
    } else if (effect === "web") fx(p, "web", 0, { ...geometry, time }, C);
    else if (effect === "dash") {
      fx(p, "dash", k, { ...geometry, x: x + k * 25, radius: 33 }, C);
      if (k > 0.5) fx(p, "stone", (k - 0.5) * 2, { ...geometry, x: x + 28, radius: 24 }, C);
    } else if (effect === "aura") fx(p, "pulse", k, { ...geometry, radius: 18 }, C);
    else if (effect === "rift") fx(p, effect, k, { ...geometry, x: targetX, radius: 35 }, C);
    else fx(p, effect, effect === "beam" || effect === "gaze" || effect === "breath" ? 0.15 : k,
      { ...geometry, radius: effect === "breath" ? 102 : radius }, C);
  }
  let pose = preparing ? prep < 0.55 ? 3 : 4 : active ? k < 0.25 ? 5 : k < 0.75 ? 6 : 7 : Math.floor(time * 7) % 2 ? 1 : 2;
  if (effect === "beam" && active) pose = Math.floor(time * 12) % 2 ? 9 : 10;
  if (effect === "crystal" && active && k > 0.6) pose = 11;
  if (key === "drummer" || effect === "aura") pose = Math.floor(time * 6) % 2 ? 3 : 6;
  const bodyX = x + (effect === "blink" && active ? 50 : effect === "dash" && active ? Math.round(k * 25) : 0);
  if (!(effect === "emerge" && preparing)) {
    p.body(key, pose, bodyX, y, 2);
  }
  if (active && effect === "slime" && k > 0.2) {

const bitmaps=Object.fromEntries(await Promise.all(Object.entries(sources).map(async([key,s])=>{const i=new Image();i.src=s.src;await i.decode();return [key,i]})));
class CanvasPainter {
 constructor(c){this.c=c;this.fillStyle='#fff';this.strokeStyle='#fff';this.globalAlpha=1}
 fillRect(x,y,w,h){this.c.fillStyle=this.fillStyle;this.c.globalAlpha=this.globalAlpha;this.c.fillRect(x,y,w,h);this.c.globalAlpha=1}
 beam(x,y,x2,y2,w,color,a){const c=this.c;c.globalAlpha=a;c.strokeStyle=color;c.lineWidth=w;c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke();c.globalAlpha=1;c.lineWidth=1}
 polygon(p,color,a){const c=this.c;c.fillStyle=color;c.globalAlpha=a;c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();c.fill();c.globalAlpha=1}
 beginPath(){this.c.beginPath()} moveTo(x,y){this.c.moveTo(x,y)} lineTo(x,y){this.c.lineTo(x,y)} arc(x,y,r,a,b){this.c.arc(x,y,r,a,b)}
 stroke(){this.c.globalAlpha=this.globalAlpha;this.c.strokeStyle=this.strokeStyle;this.c.lineWidth=1;this.c.stroke();this.c.globalAlpha=1}
 body(key,frame,x,y,scale){const s=sources[key],i=bitmaps[key];if(!s)return;let r;if(s.frames)r=s.frames[frame].frame;else r={x:Number(frame)*s.size,y:0,w:s.size,h:s.size};this.c.imageSmoothingEnabled=false;this.c.drawImage(i,r.x,r.y,r.w,r.h,Math.round(x-r.w*scale/2),Math.round(y-r.h*scale/2),r.w*scale,r.h*scale)}
}
const gallery=document.querySelector('main'), views=[];

let time=0,run=true,last=performance.now();const seek=document.querySelector('#seek'),speed=document.querySelector('#speed'),toggle=document.querySelector('#toggle');
toggle.onclick=()=>{run=!run;toggle.textContent=run?'暂停':'播放'};seek.oninput=()=>{time=Number(seek.value);run=false;toggle.textContent='播放'};
